<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flip a Coin | Mario Sumali</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* Retro dark blue background */
      background: radial-gradient(circle at 50% 30%, #1e3c72 0%, #2a5298 20%, #0f2027 100%);
      font-family: 'Press Start 2P', cursive;
      color: #fff;
      overflow: hidden;
      image-rendering: pixelated;
    }

    h1 {
      font-size: 1.2rem;
      position: absolute;
      top: 50px;
      width: 100%;
      text-align: center;
      text-shadow: 4px 4px 0px #000;
      color: #ffd700;
      pointer-events: none;
      z-index: 10;
    }

    .coin-container {
      perspective: 1200px;
      height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .scene-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateY(20px);
      z-index: 10;
    }

    .coin {
      width: 140px;
      height: 140px;
      position: relative;
      transform-style: preserve-3d;
      cursor: pointer;
      /* Resting Position */
      transform: translateY(250px) rotateX(75deg);
      transition: transform 0.2s ease;
      z-index: 20;
    }

    .coin:hover {
      transform: translateY(240px) rotateX(75deg) scale(1.05);
    }

    .coin.flipping {
      /* Faster duration: 1.5s */
      animation: coinFlipHigh 1.5s forwards;
    }

    .coin.flipping.to-tails {
      animation: coinFlipHighToTails 1.5s forwards;
    }

    /* 
       Refined Animation:
       - Immediate Spin: Rotation starts at 0% with vertical movement.
       - Explosive Launch: cubic-bezier(0.25, 0.1, 0.25, 1) ensures fast start.
       - Higher Peak: -500px
    */
    @keyframes coinFlipHigh {
      0% {
        transform: translateY(250px) rotateX(75deg);
        animation-timing-function: cubic-bezier(0.25, 0.1, 0.25, 1);
        /* Fast start, no stall */
      }

      50% {
        /* Higher Peak height (-350px) */
        transform: translateY(-350px) rotateX(-900deg);
        animation-timing-function: cubic-bezier(0.5, 0, 0.75, 1);
        /* Gravity accelerates down */
      }

      100% {
        transform: translateY(250px) rotateX(-1725deg);
      }
    }

    @keyframes coinFlipHighToTails {
      0% {
        transform: translateY(250px) rotateX(75deg);
        animation-timing-function: cubic-bezier(0.25, 0.1, 0.25, 1);
      }

      50% {
        transform: translateY(-350px) rotateX(-900deg);
        animation-timing-function: cubic-bezier(0.5, 0, 0.75, 1);
      }

      100% {
        transform: translateY(250px) rotateX(-1905deg);
      }
    }

    .coin-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .coin-heads {
      background: linear-gradient(145deg, #ffd700, #ffaa00, #ff8c00);
      border: 4px solid #b8860b;
      box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.1);
    }

    .coin-tails {
      background: linear-gradient(145deg, #c0c0c0, #a8a8a8, #909090);
      border: 4px solid #696969;
      box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.1);
      transform: rotateX(180deg);
    }

    .sun {
      width: 60px;
      height: 60px;
      background: #fffacd;
      border-radius: 50%;
      box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.2);
      position: relative;
      border: 2px solid #e6b800;
    }

    .moon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      box-shadow: 12px 4px 0 0 #f0f0f0;
      transform: rotate(-30deg);
      filter: drop-shadow(2px 2px 0 rgba(0, 0, 0, 0.3));
    }

    .star {
      position: absolute;
      background: white;
      width: 4px;
      height: 4px;
      box-shadow: 2px 2px 0 rgba(0, 0, 0, 0.2);
    }

    .star:nth-child(1) {
      top: 30px;
      left: 30px;
    }

    .star:nth-child(2) {
      top: 80px;
      left: 80px;
    }

    .star:nth-child(3) {
      top: 40px;
      left: 90px;
    }

    .coin-edge {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      transform-style: preserve-3d;
    }

    .coin-edge-layer {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #b8860b;
      border: 1px solid #8b6914;
    }

    .coin-edge-layer:nth-child(1) {
      transform: translateZ(1px);
    }

    .coin-edge-layer:nth-child(2) {
      transform: translateZ(2px);
    }

    .coin-edge-layer:nth-child(3) {
      transform: translateZ(3px);
    }

    .coin-edge-layer:nth-child(4) {
      transform: translateZ(4px);
    }

    .coin-edge-layer:nth-child(5) {
      transform: translateZ(5px);
    }

    .coin-edge-layer:nth-child(6) {
      transform: translateZ(6px);
    }

    .coin-edge-layer:nth-child(7) {
      transform: translateZ(7px);
    }

    .coin-edge-layer:nth-child(8) {
      transform: translateZ(8px);
    }

    .coin-edge-layer:nth-child(9) {
      transform: translateZ(-1px);
    }

    .coin-edge-layer:nth-child(10) {
      transform: translateZ(-2px);
    }

    .coin-edge-layer:nth-child(11) {
      transform: translateZ(-3px);
    }

    .coin-edge-layer:nth-child(12) {
      transform: translateZ(-4px);
    }

    .coin-edge-layer:nth-child(13) {
      transform: translateZ(-5px);
    }

    .coin-edge-layer:nth-child(14) {
      transform: translateZ(-6px);
    }

    .coin-edge-layer:nth-child(15) {
      transform: translateZ(-7px);
    }

    .coin-edge-layer:nth-child(16) {
      transform: translateZ(-8px);
    }

    .coin-heads {
      transform: translateZ(9px);
    }

    .coin-tails {
      transform: rotateX(180deg) translateZ(9px);
    }

    /* 
       Table Surface with stronger pixel texture
    */
    .table-surface {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, 400px) rotateX(50deg);
      width: 200vw;
      height: 2000px;
      background-color: #5d4037;
      background-image:
        repeating-linear-gradient(90deg, transparent 0, transparent 4px, rgba(0, 0, 0, 0.3) 4px, rgba(0, 0, 0, 0.3) 8px),
        repeating-linear-gradient(0deg, transparent 0, transparent 4px, rgba(0, 0, 0, 0.3) 4px, rgba(0, 0, 0, 0.3) 8px);
      background-size: 100% 100%;
      border-radius: 50%;
      box-shadow: 0 -10px 0 rgba(0, 0, 0, 0.5);
      z-index: 1;
      border-top: 8px solid #6d4c41;
    }

    .result-popup {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, 150px) scale(0.5);
      font-size: 3rem;
      color: #ffd700;
      text-shadow: 4px 4px 0 #000;
      opacity: 0;
      pointer-events: none;
      z-index: 30;
    }

    .result-popup.animate {
      /* Faster, continuous motion (no linger) */
      animation: floatUpFade 1.0s ease-out forwards;
    }

    @keyframes floatUpFade {
      0% {
        opacity: 0;
        transform: translate(-50%, 150px) scale(0.5);
      }

      15% {
        opacity: 1;
        transform: translate(-50%, 50px) scale(1.5);
      }

      /* Instant pop up */
      100% {
        opacity: 0;
        transform: translate(-50%, -200px) scale(0.5);
      }

      /* Continuous rise and shrink */
    }

    .bottom-instructions {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      z-index: 30;
    }

    .instructions {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 0.5rem;
      text-shadow: 2px 2px 0 #000;
    }

    .back-link {
      font-size: 0.7rem;
      color: rgba(255, 255, 255, 0.3);
      text-decoration: none;
    }

    .back-link:hover {
      color: #ffd700;
    }

    .shadow {
      position: absolute;
      bottom: 0;
      width: 140px;
      height: 30px;
      background: radial-gradient(ellipse, rgba(0, 0, 0, 0.8) 0%, transparent 70%);
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      opacity: 0.7;
      margin-bottom: -150px;
    }

    .coin.flipping~.shadow {
      animation: shadowPulse 2s ease-in-out;
    }

    @keyframes shadowPulse {
      0% {
        width: 140px;
        opacity: 0.7;
      }

      50% {
        width: 50px;
        opacity: 0.2;
      }

      100% {
        width: 140px;
        opacity: 0.7;
      }
    }
  </style>
</head>

<body>
  <h1>FLIP THE COIN</h1>

  <div class="coin-container">
    <div class="scene-wrapper">
      <div class="table-surface"></div>
      <div class="coin" id="coin" onclick="flipCoin()">
        <div class="coin-edge">
          <div class="coin-edge-layer"></div>
          <div class="coin-edge-layer"></div>
          <div class="coin-edge-layer"></div>
          <div class="coin-edge-layer"></div>
          <div class="coin-edge-layer"></div>
          <div class="coin-edge-layer"></div>
          <div class="coin-edge-layer"></div>
          <div class="coin-edge-layer"></div>
          <div class="coin-edge-layer"></div>
          <div class="coin-edge-layer"></div>
          <div class="coin-edge-layer"></div>
          <div class="coin-edge-layer"></div>
          <div class="coin-edge-layer"></div>
          <div class="coin-edge-layer"></div>
          <div class="coin-edge-layer"></div>
          <div class="coin-edge-layer"></div>
        </div>
        <div class="coin-face coin-heads">
          <div class="sun"></div>
        </div>
        <div class="coin-face coin-tails">
          <div class="moon"></div>
          <div class="star"></div>
          <div class="star"></div>
          <div class="star"></div>
        </div>
      </div>

      <div class="shadow"></div>

      <div id="result-popup" class="result-popup">HEADS</div>
    </div>
  </div>

  <div class="bottom-instructions">
    <p class="instructions">Click the coin to flip!</p>
    <a href="https://github.com/mariosumali" class="back-link">← Back to Profile</a>
  </div>

    // Initialize on first interaction (if not already)
    initAudio();

    // Also support unlocking on click just in case
    document.addEventListener('click', () => {
      if (audioContext && audioContext.state === 'suspended') {
        audioContext.resume();
      }
    }, { once: true });


    async function flipCoin() {
      if (isFlipping) return;

      const coin = document.getElementById('coin');
      const resultPopup = document.getElementById('result-popup');

      // Ensure audio context is ready and resumed on user interaction
      if (!audioContext) {
        await initAudio();
      }
      if (audioContext && audioContext.state === 'suspended') {
        await audioContext.resume();
      }

      isFlipping = true;
      resultPopup.classList.remove('animate');

      // Play sound using Web Audio API
      if (audioContext && coinBuffer) {
        try {
          // Create a new source for this playback
          const source = audioContext.createBufferSource();
          source.buffer = coinBuffer;
          source.connect(audioContext.destination);
          source.start(0);

          // Stop after 1.5s
          source.stop(audioContext.currentTime + 1.5);
        } catch (e) {
          console.error("Error playing sound:", e);
        }
      } else {
        console.warn("Audio not ready yet");
        // Try to init for next time
        initAudio();
      }

      const isHeads = Math.random() < 0.5;

      coin.classList.remove('flipping', 'to-tails');
      void coin.offsetWidth;

      coin.classList.add('flipping');
      if (!isHeads) coin.classList.add('to-tails');

      setTimeout(() => {
        resultPopup.textContent = isHeads ? 'HEADS' : 'TAILS';
        resultPopup.classList.add('animate');
        isFlipping = false;
        // Audio stops automatically via source.stop() schedules
      }, 1500);
    }
  </script>
